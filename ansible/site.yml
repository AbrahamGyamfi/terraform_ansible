---
# ========================================
# Main Ansible Playbook
# ========================================
# This playbook deploys a Node.js/React DevOps Dashboard application

- name: Deploy DevOps Dashboard Application
  hosts: webservers
  become: yes
  gather_facts: yes

  tasks:
    - name: Display target host information
      debug:
        msg: >
          Configuring {{ inventory_hostname }} 
          ({{ ansible_distribution }} {{ ansible_distribution_version }})
      tags:
        - always

  roles:
    - role: system
      tags:
        - system
        - nodejs

    - role: webapp
      tags:
        - webapp
        - deploy

    - role: nginx
      tags:
        - nginx

  post_tasks:
    - name: Display deployment information
      debug:
        msg:
          - "========================================"
          - "Deployment completed successfully!"
          - "========================================"
          - "Application: {{ app_name }}"
          - "Version: {{ app_version }}"
          - "Host: {{ inventory_hostname }}"
          - "Deployed at: {{ ansible_date_time.iso8601 }}"
          - "App running on port: {{ app_port }}"
          - "Nginx proxying on port: 80"
          - "========================================"
      tags:
        - always
